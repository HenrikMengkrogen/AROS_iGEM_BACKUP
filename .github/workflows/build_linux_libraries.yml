name: Build Linux Rust binary

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run native dependency setup
        run: |
          chmod +x setup.sh
          ./setup.sh

      - name: Build release binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload release binary and Linux native libraries
        uses: actions/upload-artifact@v4
        with:
          name: linux-rust-build
          path: |
            target/x86_64-unknown-linux-gnu/release/
            vendor/RNAlib/prebuilt/x86_64-unknown-linux-gnu/
            vendor/RNAlib/include/

